<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Obfuscator | Lua</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080809;color:#eee;
 font-family:Arial,sans-serif;padding:20px;
}
.container{max-width:850px;margin:25px auto}
header{text-align:center;margin-bottom:25px}
.logo{font-size:35px;font-weight:bold;color:#ff3548}
header p{color:#888}
.panel{
 background:#111114;border:1px solid #29292f;
 border-radius:15px;padding:18px;margin-bottom:18px;
}
label{display:block;margin-bottom:12px;font-weight:bold}
textarea{
 width:100%;height:220px;resize:vertical;
 background:#09090c;color:#eee;
 border:1px solid #303038;border-radius:10px;
 padding:14px;font-family:monospace;font-size:13px;
 direction:ltr;text-align:left;outline:none;
}
textarea:focus{border-color:#ff3548}
.buttons{display:flex;gap:10px;margin-top:14px}
button{
 flex:1;padding:13px;border:0;border-radius:9px;
 background:#ff3548;color:white;font-weight:bold;
 cursor:pointer;font-size:14px;
}
button.secondary{background:#26262d}
button:hover{filter:brightness(1.12)}
#status{color:#aaa;font-size:13px;margin-top:12px}
footer{text-align:center;color:#555;font-size:12px}
</style>
</head>
<body>
<div class="container">
<header>
 <div class="logo">X OBFUSCATOR</div>
 <p>Lua Script Obfuscation Tool</p>
</header>

<div class="panel">
 <label for="source">01 — السكربت الأصلي</label>
 <textarea id="source" spellcheck="false"
 placeholder="-- الصق سكربت Lua هنا..."></textarea>
 <div class="buttons">
  <button onclick="obfuscate()">تشفير السكربت</button>
  <button class="secondary" onclick="clearAll()">مسح</button>
 </div>
 <div id="status">جاهز لاستقبال السكربت.</div>
</div>

<div class="panel">
 <label for="output">02 — الناتج المشوّش</label>
 <textarea id="output" spellcheck="false" readonly
 placeholder="سيظهر الناتج هنا..."></textarea>
 <div class="buttons">
  <button onclick="copyOutput()">نسخ الناتج</button>
 </div>
</div>

<footer>X Obfuscator · Lua Tools</footer>
</div>

<script>
function obfuscate(){
 const source=document.getElementById('source').value;
 const output=document.getElementById('output');
 const status=document.getElementById('status');

 if(!source.trim()){
  status.textContent='الرجاء إدخال سكربت أولاً.';
  return;
 }

 /*
  * هذه نسخة أولية للتغليف والتشويش.
  * لا تستخدمها كبديل عن Lua parser حقيقي.
  */
 const bytes=new TextEncoder().encode(source);
 let nums=[];

 for(let i=0;i<bytes.length;i++){
  nums.push(bytes[i]);
 }

 const chunkSize=100;
 const chunks=[];
 for(let i=0;i<nums.length;i+=chunkSize){
  chunks.push(nums.slice(i,i+chunkSize).join(','));
 }

 const payload=chunks.join(',');
 const generated=
'-- X Obfuscator | Generated Lua\\n'+
'local _ENV0 = _ENV\\n'+
'local _decode = function(t)\\n'+
' local s = {}\\n'+
' for i = 1, #t do s[i] = string.char(t[i]) end\\n'+
' return table.concat(s)\\n'+
'end\\n'+
'local _data = {'+payload+'}\\n'+
'local _code = _decode(_data)\\n'+
'local _load = loadstring or load\\n'+
'if not _load then error("Lua loader unavailable") end\\n'+
'local _fn, _err = _load(_code)\\n'+
'if not _fn then error(_err) end\\n'+
'return _fn()\\n';

 output.value=generated;
 status.textContent='تم إنشاء الناتج. اختبره في بيئة آمنة قبل الاستخدام.';
}

async function copyOutput(){
 const output=document.getElementById('output');
 const status=document.getElementById('status');

 if(!output.value){
  status.textContent='لا يوجد ناتج لنسخه.';
  return;
 }

 try{
  await navigator.clipboard.writeText(output.value);
  status.textContent='تم نسخ الناتج.';
 }catch(e){
  output.focus();
  output.select();
  status.textContent='حدد الناتج وانسخه يدويًا.';
 }
}

function clearAll(){
 document.getElementById('source').value='';
 document.getElementById('output').value='';
 document.getElementById('status').textContent='تم مسح الحقول.';
}
</script>
</body>
</html>
