<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Lua Obfuscator</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;background:#09090b;color:#eee;
 font-family:Arial,sans-serif
}
main{max-width:800px;margin:20px auto}
header{text-align:center;margin-bottom:25px}
h1{color:#ff4055;font-size:27px}
p{color:#999}
section{
 background:#121216;border:1px solid #292930;
 border-radius:13px;padding:16px;margin-bottom:16px
}
label{display:block;margin-bottom:10px;font-weight:bold}
textarea{
 display:block;width:100%;height:220px;padding:13px;
 resize:vertical;background:#09090c;color:#eee;
 border:1px solid #33333b;border-radius:9px;
 font:13px monospace;direction:ltr;text-align:left
}
textarea:focus{outline:1px solid #ff4055}
.actions{display:flex;gap:10px;margin-top:12px}
button{
 flex:1;border:0;border-radius:8px;padding:13px;
 background:#e7354b;color:white;font-weight:bold;
 cursor:pointer
}
button.secondary{background:#292930}
#status{font-size:13px;margin-top:12px;color:#bbb}
</style>
</head>
<body>
<main>
<header>
<h1>X OBFUSCATOR</h1>
<p>Lua / Luau Script Tool</p>
</header>

<section>
<label for="src">السكربت الأصلي</label>
<textarea id="src" placeholder="ضع سكربت Lua هنا..."></textarea>
<div class="actions">
<button id="encode">إنشاء الناتج</button>
<button class="secondary" id="clear">مسح</button>
</div>
<div id="status">جاهز.</div>
</section>

<section>
<label for="dst">الناتج</label>
<textarea id="dst" readonly placeholder="سيظهر الناتج هنا..."></textarea>
<div class="actions">
<button id="copy">نسخ الناتج</button>
</div>
</section>
</main>

<script>
const src = document.getElementById("src");
const dst = document.getElementById("dst");
const status = document.getElementById("status");

document.getElementById("encode").onclick = () => {
  const code = src.value;
  if (!code.trim()) {
    status.textContent = "أدخل السكربت أولًا.";
    return;
  }

  // هذا تحويل إلى تمثيل عددي، وليس تشفيرًا آمنًا.
  const bytes = new TextEncoder().encode(code);
  const nums = Array.from(bytes).join(",");

  dst.value =
    "-- Generated by X Obfuscator\n" +
    "local data={" + nums + "}\n" +
    "local out={}\n" +
    "for i=1,#data do out[i]=string.char(data[i]) end\n" +
    "local code=table.concat(out)\n" +
    "-- لا يتم تشغيل النص تلقائيًا.\n" +
    "-- اختبر الناتج في بيئة Lua مناسبة قبل دمجه.\n" +
    "return code\n";

  status.textContent =
    "تم إنشاء التمثيل العددي. هذا الناتج يعيد النص ولا يشغّل السكربت.";
};

document.getElementById("copy").onclick = async () => {
  if (!dst.value) {
    status.textContent = "لا يوجد ناتج لنسخه.";
    return;
  }
  try {
    await navigator.clipboard.writeText(dst.value);
    status.textContent = "تم النسخ.";
  } catch {
    dst.focus();
    dst.select();
    status.textContent = "حدد النص وانسخه يدويًا.";
  }
};

document.getElementById("clear").onclick = () => {
  src.value = "";
  dst.value = "";
  status.textContent = "تم مسح الحقول.";
};
</script>
</body>
</html>
